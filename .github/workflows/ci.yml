# CI for justfile-rust baseline. Source of truth: delfianto/ci-rust + JUST.md
# Gates: format --check-only · lint · cargo build --all-targets · test
# Arch packaging runs alongside the Rust checks.

name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: extractions/setup-just@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # Optional — only for crates that need native libs at build time:
      # - name: System build dependencies
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y <packages>

      - name: format
        run: just format --check-only

      - name: lint
        run: just lint

      - name: build
        run: cargo build --all-targets --verbose

      - name: test
        run: just test

  arch-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install Arch build dependencies
        run: pacman -Syu --noconfirm --needed --disable-sandbox git rust systemd dbus libgcc

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build and verify Arch package
        working-directory: arch
        shell: bash
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env PKGDEST="$PWD" makepkg --clean --noconfirm
          package=$(runuser -u builder -- env PKGDEST="$PWD" makepkg --packagelist)
          test -s "$package"

          package_info=$(bsdtar -xOf "$package" .PKGINFO)
          package_version=$(awk -F ' = ' '$1 == "pkgver" { print $2 }' <<<"$package_info")
          test -n "$package_version"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v${package_version%-*}" ]]; then
            printf 'Tag %s does not match Arch package version %s\n' "$GITHUB_REF_NAME" "$package_version" >&2
            exit 1
          fi

          bsdtar -xOf "$package" .INSTALL | cmp nvprime.install -
          bsdtar -xOf "$package" usr/share/libalpm/hooks/10-nvprime-stop.hook | cmp 10-nvprime-stop.hook -
          bsdtar -xOf "$package" usr/lib/systemd/system/nvprime.service | cmp ../system/nvprime.service -

      - name: Upload Arch package
        uses: actions/upload-artifact@v7
        with:
          name: nvprime-arch-x86_64
          path: arch/nvprime-*.pkg.tar.zst
          if-no-files-found: error
          compression-level: 0

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [ci, arch-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: nvprime-arch-x86_64
          path: artifacts

      - name: Publish Arch release asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          shopt -s nullglob
          packages=(artifacts/nvprime-*.pkg.tar.zst)
          if (( ${#packages[@]} != 1 )); then
            echo 'Expected one Arch package in the build artifact.' >&2
            exit 1
          fi
          package=${packages[0]}
          if assets=$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name'); then
            if grep -Fxq "${package##*/}" <<<"$assets"; then
              printf '%s is already attached to %s.\n' "${package##*/}" "$GITHUB_REF_NAME"
            else
              gh release upload "$GITHUB_REF_NAME" "$package"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$package" --verify-tag --notes-from-tag
          fi
