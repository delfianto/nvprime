[package]
name = "nvprime"
version = "0.4.0"
edition = "2024"
rust-version = "1.100.0"
default-run = "nvprime"
description = "Minimalist NVIDIA PRIME render offload wrapper with config support"
license = "MIT"

[[bin]]
name = "nvprime"
path = "src/bin/nvprime.rs"

[[bin]]
name = "nvprimed"
path = "src/bin/nvprimed.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
nvml-wrapper = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
toml = "1.2"
zbus = { version = "6", features = ["tokio"] }

[dev-dependencies]
mockall = "0.15"
serial_test = "4"
tempfile = "3"
uuid = "1"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
strip = true
